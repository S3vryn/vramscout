name: Release v0.7.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v0.7.yml"
      - ".github/release-notes-v0.7.md"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.7.0 >/dev/null 2>&1; then
            echo "v0.7.0 already exists; leaving it unchanged."
          else
            gh release create v0.7.0 dist/* \
              --target "${GITHUB_SHA}" \
              --title "VRAMScout v0.7.0" \
              --notes-file .github/release-notes-v0.7.md
          fi
