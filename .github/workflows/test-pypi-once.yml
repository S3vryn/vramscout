name: Test PyPI package once

on:
  push:
    branches: [main]
    paths: [".github/workflows/test-pypi-once.yml"]

jobs:
  test-pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from PyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --index-url https://pypi.org/simple vramscout==0.7.0
      - name: Smoke test
        run: |
          python - <<'PY'
          import vramscout
          print("version:", vramscout.__version__)
          assert vramscout.__version__ == "0.7.0"
          PY
          vramscout --help >/tmp/help.txt
          vramscout --list-supported >/tmp/supported.txt
          head -n 20 /tmp/help.txt
          head -n 30 /tmp/supported.txt
