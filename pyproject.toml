[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vramscout"
version = "0.3.0"
description = "One-command GPU VRAM and context planner for Hugging Face LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Junchi Ma" }]
keywords = ["llm", "gpu", "vram", "huggingface", "kv-cache", "inference"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "huggingface-hub>=0.24",
  "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/S3vryn/vramscout"
Repository = "https://github.com/S3vryn/vramscout"
Issues = "https://github.com/S3vryn/vramscout/issues"

[project.scripts]
vramscout = "vramscout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
